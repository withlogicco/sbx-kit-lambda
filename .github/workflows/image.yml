name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile
      - .github/workflows/image.yml
  # Tool versions float, so rebuild weekly to pick up new Pi, Codex, and
  # Claude Code releases without a commit.
  schedule:
    - cron: "0 4 * * 1"
  # Lets the image be published from a branch before that branch merges, which
  # is needed the first time because spec.yaml references the image by tag.
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU is needed to build linux/arm64 on an amd64 runner. Apple Silicon
      # sandboxes run arm64, so that platform is not optional.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/withlogicco/sbx-kit-lambda
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=branch
            type=sha,format=short

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Assert the agent-image contract and that every binary the kit expects is
      # present, so a broken image fails here rather than at sandbox creation.
      - name: Verify image contract
        run: |
          docker run --rm \
            "ghcr.io/withlogicco/sbx-kit-lambda@${{ steps.build.outputs.digest }}" \
            sh -lc '
              set -eu
              id agent
              [ "$(id -u agent)" = 1000 ]
              for b in lambda pi codex claude; do command -v "$b"; done
              [ -x /home/agent/.local/bin/gh ]
              [ "$(readlink -f "$(command -v lambda)")" = "$(readlink -f "$(command -v pi)")" ]
              echo "image contract OK"
            '
