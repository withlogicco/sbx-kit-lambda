schemaVersion: "2"
kind: sandbox
name: lambda
displayName: Lambda
description: "Pi coding agent with native Codex and Claude subagents"
sourceURL: https://github.com/withlogicco/sbx-kit-lambda

sandbox:
  # The agent binaries are baked into this image so they are not reinstalled on
  # every sandbox creation. It is built from this repo's Dockerfile on top of
  # docker/sandbox-templates:shell-docker, which provides the agent-image
  # contract (agent user at UID 1000, passwordless sudo, /home/agent owned by
  # agent, proxy env preserved across sudo) and ships Docker in the sandbox.
  #
  # Until .github/workflows/image.yml has published this tag, build it locally.
  # The sandbox runtime keeps its OWN image store (`sbx template ls`), separate
  # from the host Docker daemon, and it never falls back to the host store: an
  # image only `docker build`-ed on the host still fails creation with
  # `403 Forbidden: pull failed`. So the build has to be handed over explicitly:
  #
  #   docker build -t ghcr.io/withlogicco/sbx-kit-lambda:latest .
  #   docker save ghcr.io/withlogicco/sbx-kit-lambda:latest -o /tmp/lambda.tar
  #   sbx template load /tmp/lambda.tar
  #
  # Once the tag is in the sandbox runtime's store, sbx uses it instead of
  # pulling, so no spec change is needed when CI starts publishing.
  # `setup.install` still runs install-tools.sh, which no-ops when the image
  # already has the tools, so the kit also works on a plain shell-docker base.
  image: "ghcr.io/withlogicco/sbx-kit-lambda:latest"
  # Declares where the image comes from. sbx accepts this but does not act on it
  # yet ("the image is taken from sandbox.image") and emits a notice saying so;
  # it is recorded here so the source of the image is discoverable from the spec.
  build:
    context: .
    dockerfile: Dockerfile
  # `lambda` is a symlink to `pi`, so the model/provider defaults ride in
  # `command` rather than in a wrapper script.
  entrypoint: [lambda]
  command:
    - --provider
    - openai-codex
    - --model
    - gpt-5.6-sol
    - --thinking
    - high
    - --models
    - "openai-codex/gpt-5.6-sol:high,openai-codex/gpt-5.6-terra:max,openai-codex/gpt-5.6-luna:high,opencode-go/*,anthropic/*"

agentInstructions:
  filename: AGENTS.md
  content: |
    ## AGENTS.md scope and ownership

    - Keep `AGENTS.md` for rules and knowledge that affect the way you write code and structure the repository.
    - Include important documentation and rules in function documentation.
    - Decisions that need explanation or context should be recorded as inline comments.
    - That said, do not overdocument and avoid documenting obvious or trivial things. The goal is to make the code and its structure self-explanatory, not to create a separate knowledge base.

    ## Maintaining session learnings

    - Every time the user corrects an important behavior or implementation decision, record that learning in `AGENTS.md` file in the same change set, or the respective file as code comments.
    - Treat repeated corrections and workflow mistakes as high-priority learnings to persist.
    - Keep learnings concise, actionable, and scoped to the right level (global, app-local, or `src`).
    - Do not include learnings for things that make sense only in that session context.

    ## Testing with Docker Compose

    - When a Docker Compose configuration is present, boot its dependent services with the local Docker daemon (for example, `docker compose up -d postgres redis`) and ensure their published ports are available on `localhost`.
    - Run the web app's tests from the workspace, not from a Compose container. The web app's test command must supply the environment variables it needs to connect to those services through `localhost`.
    - Use the .github/workflows files to understand what tests and linting need to be run and how.

    ## Plan conventions

    - When creating a plan, always write it to `agents/plans/{slug}.md`.
    - Keep plans concise: scope, steps, relevant files, implementation, verification, and decisions.
    - When done, keep only the plan as a log of the changes and decisions. In case the plan is very trivial and does not contain decisions, remove it completely.

    ## Native subagents

    - Never invoke Codex, Claude, or `run_subagent` proactively. Only delegate after the current user clearly asks for a native subagent.
    - Once the user has requested delegation, invoke `run_subagent` normally. The tool itself does not second-guess or block the model's interpretation of that request.
    - Native subagents run inside the SBX security boundary and must proceed without asking for permission or approval.

    ## Rules of engagement

    - Do not create, amend, or push commits unless the user explicitly asks for a commit or PR.
    - When you need the user to review a change, always stage the changes locally and ask for a review.
    - Always create worktrees in the .worktrees directory within the repository. If .worktrees is not Git ignored globally, add it to the repository's .gitignore.

permissions:
  network:
    allow:
      - pi.dev
      - webi.sh
      - registry.npmjs.org
      - opencode.ai
      - github.com
      - raw.githubusercontent.com
      - release-assets.githubusercontent.com
      # OpenAI: OAuth token endpoint plus the Codex/ChatGPT backend hosts
      - auth.openai.com
      - chatgpt.com
      - api.openai.com
      - openai.com
      # Anthropic: OAuth token endpoint plus API and download hosts
      - platform.claude.com
      - api.anthropic.com
      - claude.ai
      - console.anthropic.com
      - downloads.claude.ai
      - claude.com
      - registry.terraform.io
      - docs.cloud.google.com
      # VS Code server download and extension gallery (Remote-SSH installs)
      - update.code.visualstudio.com
      - vscode.download.prss.microsoft.com
      - marketplace.visualstudio.com
      - vscode.blob.core.windows.net
      - "*.vsassets.io"
      # GitHub CLI API access
      - api.github.com
      - objects.githubusercontent.com

environment:
  variables:
    # Claude Code checks this before accepting --dangerously-skip-permissions.
    IS_SANDBOX: "1"
    CODEX_HOME: /home/agent/.codex
    # A 401 from the credentials proxy must fail fast instead of making git
    # open /dev/tty for a username, which would freeze the TUI.
    GIT_TERMINAL_PROMPT: "0"

credentials:
  #   sbx secret set chatgpt-codex \
  #     --command 'pi auth print-bearer-token --provider openai-codex' \
  #     --refresh on-demand
  - service: chatgpt-codex
    description: "ChatGPT subscription access token, minted on the host by Pi"
    required: true
    apiKey:
      name: LAMBDA_CHATGPT_TOKEN
      proxyManaged: true
      inject:
        - domain: chatgpt.com
          header: Authorization
          format: "Bearer %s"
  #   sbx secret set claude-code \
  #     --command 'pi auth print-bearer-token --provider anthropic' \
  #     --refresh on-demand
  - service: claude-code
    description: "Anthropic usage-based access token, minted on the host by Pi"
    required: false
    apiKey:
      name: CLAUDE_CODE_OAUTH_TOKEN
      proxyManaged: true
      inject:
        - domain: api.anthropic.com
          header: Authorization
          format: "Bearer %s"
  - service: opencode-go
    description: "OpenCode Go API key used by Pi"
    required: true
    apiKey:
      name: OPENCODE_API_KEY
      proxyManaged: true
      inject:
        - domain: opencode.ai
          header: Authorization
          format: "Bearer %s"
  - service: github
    description: "GitHub token for the gh CLI and git over HTTPS"
    required: false
    apiKey:
      name: GH_TOKEN
      proxyManaged: true
      inject:
        - domain: api.github.com
          scheme: bearer
        - domain: raw.githubusercontent.com
          scheme: bearer
        - domain: github.com
          scheme: basic
          username: x-access-token

# Volumes survive sandbox recreation. Persist only the narrowest conversation
# stores needed to resume sessions; Claude's co-located project memory is also
# retained. Configuration, credentials, caches, and other CLI state are
# intentionally recreated with the sandbox. `~/.pi/agent` as a whole must not
# be mounted because that would shadow the kit-owned extensions and models.json
# across kit updates.
volumes:
  - path: /home/agent/.pi/agent/sessions
    size: 2g
  - path: /home/agent/.claude/projects
    size: 2g
  - path: /home/agent/.codex/sessions
    size: 1g

setup:
  install:
    - command: |
        set -eu
        mkdir -p /home/agent/.pi/agent/extensions /home/agent/.pi/agent/sessions \
                 /home/agent/.claude/projects /home/agent/.codex/sessions /home/agent/.agents
        chown -R agent:agent /home/agent/.pi /home/agent/.claude /home/agent/.codex /home/agent/.agents
      user: "0"
      description: "Ensure agent ownership of the Pi, Claude, and Codex home directories"
    - command: 'if [ -n "${HTTP_PROXY:-}" ]; then npm config set proxy="$HTTP_PROXY" https-proxy="${HTTPS_PROXY:-$HTTP_PROXY}"; fi'
      user: "1000"
      description: "Configure npm to use the sandbox proxy"
    # Tool installation lives in files/home/.lambda/install-tools.sh so the
    # Dockerfile and this kit share one source of truth. Static files under
    # files/home/ land before install commands run. Every step in the script is
    # guarded, so this is a no-op against a prebuilt image that already has the
    # tools.
    - command: "sh /home/agent/.lambda/install-tools.sh"
      user: "1000"
      description: "Install Pi, the lambda binary, and the native Codex, Claude Code, and gh CLIs"
    # Point the native Codex CLI at the ChatGPT backend through a custom model
    # provider, mirroring what the built-in codex kit does in `oauth` mode. The
    # bearer token here is only a placeholder that makes Codex emit an
    # Authorization header; the proxy overwrites it with the host-minted token
    # from the `chatgpt-codex` credential. requires_openai_auth = false stops
    # Codex from insisting on its own login, and forced_login_method = "api"
    # stops a remote client from replacing this with sandbox-local OAuth.
    # Rewritten unconditionally on every create, so it is deterministic and
    # idempotent. Only ~/.codex/sessions is persisted.
    - command: |
        set -eu
        mkdir -p /home/agent/.codex
        cat > /home/agent/.codex/config.toml <<'EOF'
        approval_policy = "never"
        sandbox_mode = "danger-full-access"
        mcp_oauth_credentials_store = "file"
        forced_login_method = "api"
        model_provider = "sandboxd"

        [model_providers.sandboxd]
        name = "Sandbox Proxy"
        base_url = "https://chatgpt.com/backend-api/codex"
        experimental_bearer_token = "oai-oat01-proxy-managed"
        requires_openai_auth = false
        EOF
        printf '%s' '{"OPENAI_API_KEY":"proxy-managed"}' > /home/agent/.codex/auth.json
        chmod 600 /home/agent/.codex/auth.json
      user: "1000"
      description: "Point the native Codex CLI at the proxy-injected ChatGPT backend"
    # ~/.claude.json holds Claude Code's onboarding/trust/bypass flags and is
    # credential-independent. Written as root and chowned because the file may
    # already exist with restrictive ownership.
    - command: |
        set -e
        ws="${WORKSPACE_DIR:-/}"
        esc=$(printf '%s' "$ws" | sed 's/\\/\\\\/g; s/"/\\"/g; s/\t/\\t/g; s/\r/\\r/g')
        projects="\"/\": { \"hasTrustDialogAccepted\": true }"
        [ "$ws" = "/" ] || projects="$projects, \"$esc\": { \"hasTrustDialogAccepted\": true }"
        printf '%s\n' "{
          \"bypassPermissionsModeAccepted\": true,
          \"hasCompletedOnboarding\": true,
          \"projects\": { $projects }
        }" > /home/agent/.claude.json
        chown agent:agent /home/agent/.claude.json
      user: "0"
      description: "Seed Claude Code bypass and trust flags"
    # No apiKeyHelper here, deliberately. The built-in claude kit seeds
    # `apiKeyHelper: "echo proxy-managed"` so Claude Code presents the proxy
    # sentinel, but proxy-managed OAuth does not activate for a third-party
    # sandbox kit (verified: the proxy never substitutes the sentinel). Writing
    # the helper would make Claude Code send a dead sentinel and never prompt,
    # which breaks the in-sandbox `/login` that is the only working path here.
    # SBX_CRED_ANTHROPIC_MODE is not a usable gate either: it reports `apikey`
    # even for a credential this kit declares as OAuth-only.
    - command: |
        set -e
        mkdir -p /home/agent/.claude
        printf '%s' "{
          \"alwaysThinkingEnabled\": true,
          \"defaultMode\": \"bypassPermissions\",
          \"bypassPermissionsModeAccepted\": true
        }
        " > /home/agent/.claude/settings.json
      user: "1000"
      description: "Seed Claude Code settings"
