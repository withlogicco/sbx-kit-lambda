schemaVersion: "2"
kind: mixin
name: lambda
displayName: lambda
description: "lambda agent"

agentContext: |
  ## AGENTS.md scope and ownership

  - Keep `AGENTS.md` for rules and knowledge that affect the whole repository.
  - Create and keep app-specific rules in `<app>/AGENTS.md` for Django projects, when guidance only applies to one app.
  - When both global and local rules exist for a given scope, apply both, with the more specific file taking precedence for that scope.

  ## Maintaining session learnings

  - Every time the user corrects an important behavior or implementation decision, record that learning in the relevant `AGENTS.md` file in the same change set.
  - Treat repeated corrections and workflow mistakes as high-priority learnings to persist.
  - Keep learnings concise, actionable, and scoped to the right level (global, app-local, or `src`).
  - Do not include learnings for things that make sense only in that session context.

  ## Plan conventions

  - When creating a plan, always write it to `agents/plans/yyyy-mm-dd-slug.md`.
  - Keep plans concise: scope, steps, relevant files, verification, and decisions.
  - When done, keep only the plan as a log of the changes and decisions.
  - Include an `agents/CHANGELOG.md` entry with the date, plan link, and short description for each plan.

caps:
  network:
    allow:
      - pi.dev
      - registry.npmjs.org
      - opencode.ai
      - github.com
      - raw.githubusercontent.com
      - release-assets.githubusercontent.com
      - chatgpt.com

credentials:
  - service: opencode-go
    description: "OpenCode Go API key"
    apiKey:
      name: OPENCODE_API_KEY
      proxyManaged: true
      inject:
        - domain: opencode.ai
          header: Authorization
          format: "Bearer %s"

commands:
  install:
    - command: "npm config set proxy $HTTP_PROXY && npm config set https-proxy $HTTP_PROXY"
      user: "1000"
      description: "Configure npm proxy for the Pi installer"
    - command: 'i=0; while [ $i -lt 5 ]; do if curl -fsSL https://pi.dev/install.sh -o /tmp/pi-install.sh && sh /tmp/pi-install.sh; then break; fi; i=$((i+1)); echo "Retrying ($i/5)..."; sleep 2; done; [ $i -lt 5 ]'
      user: "1000"
      description: "Install Pi coding agent with the pi.dev installer"
    - command: |
        mv /usr/local/share/npm-global/bin/codex /usr/local/share/npm-global/bin/sbx-codex
        cat > /usr/local/share/npm-global/bin/codex <<'SH'
        #!/bin/sh
        set -eu
        if [ "${1:-}" = "--dangerously-bypass-approvals-and-sandbox" ]; then
          shift
        fi
        exec pi \
          --provider openai-codex \
          --model gpt-5.6-terra \
          --thinking high \
          --models "openai-codex/*,opencode-go/*" \
          "$@"
        SH
        chmod +x /usr/local/share/npm-global/bin/codex
      user: "0"
      description: "Make Codex launch lambda while retaining SBX OAuth identity"
